name: BentoBox-TopBlock
main: world.bentobox.topblock.TopBlockPladdon
version: ${project.version}${build.number}
api-version: "1.21"

# BentoBox must be installed: this jar is an addon and belongs in plugins/BentoBox/addons.
# Declaring it makes Paper explain a missing BentoBox, and load it before this jar.
depend: [BentoBox]

# Pladdon names of the game modes we hook into. Soft, because either alone is enough,
# but required so that our plugin class loader can see their classes.
softdepend:
  - BentoBox-AOneBlock
  - BentoBox-ChunkBlock

authors: [tastybento]
contributors: ["The BentoBoxWorld Community"]
website: https://bentobox.world
description: ${project.description}
