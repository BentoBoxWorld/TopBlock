name: TopBlock
main: world.bentobox.topblock.TopBlock
version: ${version}${build.number}
icon: GRASS_BLOCK
api-version: 2.7.1

authors: tastybento

softdepend: AOneBlock, ChunkBlock

permissions:
  'aoneblock.island.topblock':
    description: Player can use TopBlock command
    default: true
  'aoneblock.intopten':
    description: Player's island will be listed in the top ten. Remove from admins or testers to hide them.
    default: true
  'chunkblock.island.topblock':
    description: Player can use TopBlock command
    default: true
  'chunkblock.intopten':
    description: Player's island will be listed in the top ten. Remove from admins or testers to hide them.
    default: true
