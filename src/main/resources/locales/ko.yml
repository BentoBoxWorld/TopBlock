island:
  topblock:
    description: "AOneBlock 상위 10위 표시"
    gui-title: "&a Top Ten"
    gui-heading: "&6[name]: &B[rank]"
    island-level: "&b 수 [count]"


topblock:
  gui:
    titles:
      top: "&0&l 상위 섬"
      detail-panel: "&0&l [name]의 섬"
      value-panel: "&0&l 블록 값"
    buttons:
      island:
        empty: '&f&l [name]. 위'
        name: '&f&l [name]'
        description: |-
          [owner]
          [members]
          [place]
          [count]
          [lifetime]
        # Text that is replacing [name] if island do not have a name
        owners-island: '[player]의 섬'
        # Text for [owner] in description.
        owner: '&7&l 소유자: &r&b [player]'
        # Title before listing members for [members] in description
        members-title: '&7&l 멤버:'
        # List each member under the title for [members] in description
        member: "&b - [player]"
        # Name of unknown player.
        unknown: "알 수 없음"
        # Section for parsing [place]
        place: '&7&o [number]. &r&7 위'
        # Section for parsing [count]
        count: '&7 블록 수: &o [number]'
        # Section for parsing [lifetime]
        lifetime: '&7 누적 블록 수: &o [number]'
      # Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: '&f&l 이전 페이지'
        description: |-
          &7 [number] 페이지로 이동
      # Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: '&f&l 다음 페이지'
        description: |-
          &7 [number] 페이지로 이동
    tips:
      click-to-view: '&e 클릭 &7 하여 보기.'
      click-to-previous: '&e 클릭 &7 하여 이전 페이지 보기.'
      click-to-next: '&e 클릭 &7 하여 다음 페이지 보기.'
      click-to-select: '&e 클릭 &7 하여 선택.'
      left-click-to-cycle-up: '&e 좌클릭 &7 하여 위로 이동.'
      right-click-to-cycle-down: '&e 우클릭 &7 하여 아래로 이동.'
      left-click-to-change: '&e 좌클릭 &7 하여 편집.'
      right-click-to-clear: '&e 우클릭 &7 하여 지우기.'
      click-to-asc: '&e 클릭 &7 하여 오름차순 정렬.'
      click-to-desc: '&e 클릭 &7 하여 내림차순 정렬.'
      click-to-warp: '&e 클릭 &7 하여 워프.'
      click-to-visit: '&e 클릭 &7 하여 방문.'
      right-click-to-visit: '&e 우클릭 &7 하여 방문.'
