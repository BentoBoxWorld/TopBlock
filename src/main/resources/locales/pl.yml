island:
  topblock:
    description: "pokaż Top Dziesięć AOneBlock"
    gui-title: "&a Top Ten"
    gui-heading: "&6[name]: &B[rank]"
    island-level: "&b Liczba [count]"


topblock:
  gui:
    titles:
      top: "&0&l Najlepsze Wyspy"
      detail-panel: "&0&l Wyspa gracza [name]"
      value-panel: "&0&l Wartości bloków"
    buttons:
      island:
        empty: '&f&l [name]. miejsce'
        name: '&f&l [name]'
        description: |-
          [owner]
          [members]
          [place]
          [count]
          [lifetime]
        # Text that is replacing [name] if island do not have a name
        owners-island: 'Wyspa gracza [player]'
        # Text for [owner] in description.
        owner: '&7&l Właściciel: &r&b [player]'
        # Title before listing members for [members] in description
        members-title: '&7&l Członkowie:'
        # List each member under the title for [members] in description
        member: "&b - [player]"
        # Name of unknown player.
        unknown: "nieznany"
        # Section for parsing [place]
        place: '&7&o [number]. &r&7 miejsce'
        # Section for parsing [count]
        count: '&7 Liczba bloków: &o [number]'
        # Section for parsing [lifetime]
        lifetime: '&7 Łączna liczba bloków: &o [number]'
      # Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: '&f&l Poprzednia Strona'
        description: |-
          &7 Przełącz na stronę [number]
      # Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: '&f&l Następna Strona'
        description: |-
          &7 Przełącz na stronę [number]
    tips:
      click-to-view: '&e Kliknij &7 aby zobaczyć.'
      click-to-previous: '&e Kliknij &7 aby zobaczyć poprzednią stronę.'
      click-to-next: '&e Kliknij &7 aby zobaczyć następną stronę.'
      click-to-select: '&e Kliknij &7 aby wybrać.'
      left-click-to-cycle-up: '&e Lewy klik &7 aby przewinąć w górę.'
      right-click-to-cycle-down: '&e Prawy klik &7 aby przewinąć w dół.'
      left-click-to-change: '&e Lewy klik &7 aby edytować.'
      right-click-to-clear: '&e Prawy klik &7 aby wyczyścić.'
      click-to-asc: '&e Kliknij &7 aby posortować rosnąco.'
      click-to-desc: '&e Kliknij &7 aby posortować malejąco.'
      click-to-warp: '&e Kliknij &7 aby warp.'
      click-to-visit: '&e Kliknij &7 aby odwiedzić.'
      right-click-to-visit: '&e Prawy klik &7 aby odwiedzić.'
