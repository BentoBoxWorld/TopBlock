island:
  topblock:
    description: "顯示AOneBlock前十名"
    gui-title: "&a Top Ten"
    gui-heading: "&6[name]: &B[rank]"
    island-level: "&b 計數 [count]"


topblock:
  gui:
    titles:
      top: "&0&l 頂級島嶼"
      detail-panel: "&0&l [name]的島嶼"
      value-panel: "&0&l 方塊價值"
    buttons:
      island:
        empty: '&f&l 第[name]名'
        name: '&f&l [name]'
        description: |-
          [owner]
          [members]
          [place]
          [count]
          [lifetime]
        # Text that is replacing [name] if island do not have a name
        owners-island: '[player]的島'
        # Text for [owner] in description.
        owner: '&7&l 擁有者: &r&b [player]'
        # Title before listing members for [members] in description
        members-title: '&7&l 成員:'
        # List each member under the title for [members] in description
        member: "&b - [player]"
        # Name of unknown player.
        unknown: "未知"
        # Section for parsing [place]
        place: '&7&o 第[number]名 &r&7'
        # Section for parsing [count]
        count: '&7 方塊數: &o [number]'
        # Section for parsing [lifetime]
        lifetime: '&7 累計方塊數: &o [number]'
      # Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: '&f&l 上一頁'
        description: |-
          &7 切換到第[number]頁
      # Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: '&f&l 下一頁'
        description: |-
          &7 切換到第[number]頁
    tips:
      click-to-view: '&e 點擊 &7 查看。'
      click-to-previous: '&e 點擊 &7 查看上一頁。'
      click-to-next: '&e 點擊 &7 查看下一頁。'
      click-to-select: '&e 點擊 &7 選擇。'
      left-click-to-cycle-up: '&e 左鍵點擊 &7 向上翻。'
      right-click-to-cycle-down: '&e 右鍵點擊 &7 向下翻。'
      left-click-to-change: '&e 左鍵點擊 &7 編輯。'
      right-click-to-clear: '&e 右鍵點擊 &7 清除。'
      click-to-asc: '&e 點擊 &7 按升序排序。'
      click-to-desc: '&e 點擊 &7 按降序排序。'
      click-to-warp: '&e 點擊 &7 傳送。'
      click-to-visit: '&e 點擊 &7 訪問。'
      right-click-to-visit: '&e 右鍵點擊 &7 訪問。'
