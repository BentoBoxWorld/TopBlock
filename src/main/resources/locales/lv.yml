island:
  topblock:
    description: "parādīt AOneBlock Top Desmit"
    gui-title: "&a Top Ten"
    gui-heading: "&6[name]: &B[rank]"
    island-level: "&b Skaits [count]"


topblock:
  gui:
    titles:
      top: "&0&l Labākie Salās"
      detail-panel: "&0&l [name] sala"
      value-panel: "&0&l Bloku vērtības"
    buttons:
      island:
        empty: '&f&l [name]. vieta'
        name: '&f&l [name]'
        description: |-
          [owner]
          [members]
          [place]
          [count]
          [lifetime]
        # Text that is replacing [name] if island do not have a name
        owners-island: '[player] sala'
        # Text for [owner] in description.
        owner: '&7&l Īpašnieks: &r&b [player]'
        # Title before listing members for [members] in description
        members-title: '&7&l Dalībnieki:'
        # List each member under the title for [members] in description
        member: "&b - [player]"
        # Name of unknown player.
        unknown: "nezināms"
        # Section for parsing [place]
        place: '&7&o [number]. &r&7 vieta'
        # Section for parsing [count]
        count: '&7 Bloku skaits: &o [number]'
        # Section for parsing [lifetime]
        lifetime: '&7 Kopējais bloku skaits: &o [number]'
      # Button that is used in multi-page GUIs which allows to return to previous page.
      previous:
        name: '&f&l Iepriekšējā Lapa'
        description: |-
          &7 Pārslēgties uz lapu [number]
      # Button that is used in multi-page GUIs which allows to go to next page.
      next:
        name: '&f&l Nākamā Lapa'
        description: |-
          &7 Pārslēgties uz lapu [number]
    tips:
      click-to-view: '&e Noklikšķini &7 lai skatītu.'
      click-to-previous: '&e Noklikšķini &7 lai skatītu iepriekšējo lapu.'
      click-to-next: '&e Noklikšķini &7 lai skatītu nākamo lapu.'
      click-to-select: '&e Noklikšķini &7 lai izvēlētos.'
      left-click-to-cycle-up: '&e Kreisais klikšķis &7 lai ritinātu augšup.'
      right-click-to-cycle-down: '&e Labais klikšķis &7 lai ritinātu lejup.'
      left-click-to-change: '&e Kreisais klikšķis &7 lai rediģētu.'
      right-click-to-clear: '&e Labais klikšķis &7 lai notīrītu.'
      click-to-asc: '&e Noklikšķini &7 lai kārtotu augošā secībā.'
      click-to-desc: '&e Noklikšķini &7 lai kārtotu dilstošā secībā.'
      click-to-warp: '&e Noklikšķini &7 lai teleportētos.'
      click-to-visit: '&e Noklikšķini &7 lai apmeklētu.'
      right-click-to-visit: '&e Labais klikšķis &7 lai apmeklētu.'
